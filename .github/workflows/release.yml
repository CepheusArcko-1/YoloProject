name: Release

# Publier une version :  git tag v1.0.0  puis  git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compiler YOLO Detection.exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --noconsole --icon yolo_detection/static/icon.ico --name "YOLO Detection" --paths . --distpath . yolo_detection/launcher.py

      - name: Préparer l'archive
        shell: pwsh
        run: |
          $name = "YOLO-Detection-${{ github.ref_name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "YOLO Detection.exe", requirements.txt, README.md, LICENSE -Destination $name
          Copy-Item yolo_detection -Destination $name -Recurse
          Get-ChildItem $name -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Publier la version sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "YOLO-Detection-${{ github.ref_name }}.zip" --title "YOLO Detection ${{ github.ref_name }}" --generate-notes
